name: Build TS SE Tool

on:
  workflow_dispatch:
  push:
    branches: [ master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: nuget/setup-nuget@v2

      - name: Restore NuGet packages
        run: nuget restore "TS SE Tool.sln"

      - name: Build solution
        run: msbuild "TS SE Tool.sln" /p:Configuration=Release /p:Platform="Any CPU"

      - name: Zip build output
        shell: pwsh
        run: |
          $out = "TS-SE-Tool-build.zip"
          Compress-Archive -Path "TS SE Tool\bin\Release\*", "TS SET Updater\bin\Release\*" -DestinationPath $out
          echo "ZIP_PATH=$out" >> $env:GITHUB_ENV

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: ${{ env.ZIP_PATH }}
